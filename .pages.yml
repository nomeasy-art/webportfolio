media:
  input: images/projects
  output: images/projects

content:
  - name: projects
    label: Progetti
    type: collection
    path: projects
    format: json
    filename: "{fields.slug}.json"
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: collaborator
        label: Collaboratore
        type: string
      - name: year
        label: Anno
        type: string
      - name: description
        label: Descrizione
        type: text
      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: editorial
              label: Editorial
            - name: packaging
              label: Packaging
            - name: book-cover
              label: Book Cover
            - name: user-interface
              label: Brand Identity
      - name: tags
        label: Tag
        type: string
        list: true
      - name: mainImageUrl
        label: Immagine Principale
        type: image
      - name: gallery
        label: Galleria Immagini
        type: image
        options:
          multiple:
            max: 20
      - name: externalLink
        label: Link Esterno
        type: string
      - name: featured
        label: In Evidenza
        type: boolean
      - name: order
        label: Ordine
        type: number
    view:
      fields: [mainImageUrl, title, category, year, featured]
      primary: title
      sort: [order, title, year]
      search: [title, description, collaborator, tags]
      default:
        sort: order
        order: asc
