<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOMEASY — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- Percorsi assoluti: così la pagina funziona sia su /admin sia su /admin/ -->
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="icon" href="/favicon.svg" />
</head>

<body>
    <!-- Schermata di accesso -->
    <section class="login" id="login">
        <form class="login-box" id="login-form">
            <h1>design gallery</h1>
            <div class="info-row">DASHBOARD</div>
            <input type="password" id="login-password" placeholder="PASSWORD" autocomplete="current-password"
                required />
            <button type="submit" class="button">ENTRA</button>
            <p class="login-error" id="login-error" hidden></p>
        </form>
    </section>

    <!-- Dashboard: stessa griglia a 5 colonne del sito -->
    <main class="admin-grid" id="dashboard" hidden>
        <aside class="sidebar column">
            <header class="logo-header">
                <h1>design gallery</h1>
            </header>

            <div class="details-section">
                <div class="info-row">VINCENZO FUCCIA</div>
                <div class="info-row">NOMEASY@GMAIL.COM</div>
                <div class="info-row">©2026 ALL RIGHTS RESERVED.</div>
            </div>

            <button type="button" class="button save-button" id="save">SALVA MODIFICHE</button>
            <div class="save-state" id="save-state"></div>

            <footer class="sidebar-footer">
                <div class="social-icons">
                    <img src="/Instagram.svg" alt="Instagram" class="social-icon">
                    <img src="/TikTok.svg" alt="TikTok" class="social-icon">
                    <img src="/Linkedin.svg" alt="Linkedin" class="social-icon">
                </div>
                <button type="button" class="logout" id="logout">ESCI</button>
            </footer>
        </aside>

        <section class="rows column" id="rows">
            <div class="loading" id="loading">CARICO I PROGETTI…</div>
        </section>
    </main>

    <!-- Selettore file: uno solo, riusato sia per la preview sia per la galleria -->
    <input type="file" id="file-input" accept="image/*,video/mp4,video/webm" multiple hidden />

    <script type="module" src="/admin/admin.js"></script>
</body>

</html>
