<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincenzo Fuccia - Web Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <!-- Intro: tenda veneziana che si apre al caricamento (lamelle generate via JS) -->
    <div class="intro-blinds" aria-hidden="true"></div>

    <main class="portfolio-grid">
        <!-- Column 1 -->
        <aside class="sidebar column">
            <header class="logo-header">
                <h1>design gallery</h1>
            </header>

            <div class="details-section">
                <div class="info-row top-border">
                    <span>VINCENZO FUCCIA</span>
                </div>
                <div class="info-row">NOMEASY@GMAIL.COM</div>
                <div class="info-row">©2026 ALL RIGHTS RESERVED.</div>
            </div>

            <footer class="sidebar-footer">
                <div class="social-icons">
                    <a href="#"><img src="Instagram.svg" alt="Instagram" class="social-icon"></a>
                    <a href="#"><img src="TikTok.svg" alt="TikTok" class="social-icon"></a>
                    <a href="#"><img src="Linkedin.svg" alt="Linkedin" class="social-icon"></a>
                </div>
            </footer>
        </aside>

        <!-- Column 2 -->
        <section class="category-column column" data-category="editorial">
            <div class="category-header">
                <h2>editorial</h2>
                <div class="close-detail-mobile">CHIUDI</div>
            </div>
            <div class="scroll-wrapper" id="editorial-wrapper">
                <!-- Projects will be injected here via JS -->
            </div>
        </section>

        <!-- Column 3 -->
        <section class="category-column column" data-category="packaging">
            <div class="category-header">
                <h2>packaging</h2>
                <div class="close-detail-mobile">CHIUDI</div>
            </div>
            <div class="scroll-wrapper" id="packaging-wrapper">
                <!-- Projects will be injected here via JS -->
            </div>
        </section>

        <!-- Column 4 -->
        <section class="category-column column" data-category="book-cover">
            <div class="category-header">
                <h2>book cover</h2>
                <div class="close-detail-mobile">CHIUDI</div>
            </div>
            <div class="scroll-wrapper" id="book-cover-wrapper">
                <!-- Projects will be injected here via JS -->
            </div>
        </section>

        <!-- Column 5 -->
        <section class="category-column column" data-category="user-interface">
            <div class="category-header">
                <h2>brand identity</h2>
                <div class="close-detail-mobile">CHIUDI</div>
            </div>
            <div class="scroll-wrapper" id="user-interface-wrapper">
                <!-- Projects will be injected here via JS -->
            </div>
        </section>

        <!-- Mobile Footer (for extra scroll space on last category) -->
        <footer class="mobile-footer">
            <div class="social-icons">
                <a href="#"><img src="Instagram.svg" alt="Instagram" class="social-icon"></a>
                <a href="#"><img src="TikTok.svg" alt="TikTok" class="social-icon"></a>
                <a href="#"><img src="Linkedin.svg" alt="Linkedin" class="social-icon"></a>
            </div>
        </footer>

        <!-- Project Detail View -->
        <section class="project-detail-view">
            <div class="close-detail">CHIUDI</div>
            <div class="detail-scroll">
                <div class="large-image"></div>
                <div class="large-image"></div>
                <div class="large-image"></div>
                <div class="large-image"></div>
                <div class="large-image"></div>
                <div class="large-image"></div>
                <div class="large-image"></div>
                <div class="large-image"></div>
            </div>
        </section>
    </main>
    <script type="module" src="script.js"></script>
</body>

</html>
